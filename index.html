      // --- Sound Synthesizer Engine (Web Audio API) ---
      class SoundEngine {
        constructor() {
          this.ctx = null;
          this.enabled = true;
        }
        init() {
          if (!this.ctx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (AudioContext) this.ctx = new AudioContext();
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
        }
        play(type) {
          if (!this.enabled) return;
          try {
            this.init();
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.connect(gain);
            gain.connect(this.ctx.destination);

            if (type === 'click') {
              osc.type = 'sine';
              osc.frequency.setValueAtTime(800, now);
              osc.frequency.exponentialRampToValueAtTime(400, now + 0.05);
              gain.gain.setValueAtTime(0.08, now);
              gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
              osc.start(now);
              osc.stop(now + 0.05);
            } else if (type === 'warp') {
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(300, now);
              osc.frequency.exponentialRampToValueAtTime(950, now + 0.25);
              gain.gain.setValueAtTime(0.06, now);
              gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
              osc.start(now);
              osc.stop(now + 0.25);
            } else if (type === 'success') {
              osc.type = 'sine';
              osc.frequency.setValueAtTime(523.25, now); // C5
              osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
              osc.frequency.setValueAtTime(783.99, now + 0.16); // G5
              gain.gain.setValueAtTime(0.08, now);
              gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
              osc.start(now);
              osc.stop(now + 0.3);
            } else if (type === 'delete') {
              osc.type = 'sawtooth';
              osc.frequency.setValueAtTime(400, now);
              osc.frequency.exponentialRampToValueAtTime(120, now + 0.2);
              gain.gain.setValueAtTime(0.07, now);
              gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
              osc.start(now);
              osc.stop(now + 0.2);
            }
          } catch (e) {
            // Audio context not ready
          }
        }

        { id: 'budget', name: 'Budget Station', desc: 'Thresholds & Velocity Control', x: 1100, y: 700, zoom: 0.95, icon: 'Sliders' },
        { id: 'observatory', name: 'Observatory', desc: 'Vector Distribution & Donut breakdown', x: -1100, y: -450, zoom: 0.95, icon: 'PieChart' },
        { id: 'timetunnel', name: 'Time Tunnel', desc: 'Historical Chrono-Flow Analytics', x: -1100, y: 550, zoom: 0.95, icon: 'Calendar' },
        { id: 'admin', name: 'Admin Command', desc: 'Multi-User Governance Matrix', x: 0, y: -1150, zoom: 0.95, icon: 'Shield', adminOnly: true },
      ];

      // ==========================================
      // MAIN APP COMPONENT
      // ==========================================
      function App() {
        // Auth State
        const [users, setUsers] = useState(() => getStored('users', DEFAULT_USERS));
        const [currentUser, setCurrentUser] = useState(() => getStored('current_user', DEFAULT_USERS[0]));
        const [authMode, setAuthMode] = useState('login'); // 'login' | 'register'
        const [authEmail, setAuthEmail] = useState('');
        const [authPassword, setAuthPassword] = useState('');
        const [authName, setAuthName] = useState('');

        // App Data
        const [categories, setCategories] = useState(() => getStored('categories', DEFAULT_CATEGORIES));
        const [transactions, setTransactions] = useState(() => getStored('transactions', DEFAULT_TRANSACTIONS));
        const [budgets, setBudgets] = useState(() => getStored('budgets', DEFAULT_BUDGETS));
        const [currency, setCurrency] = useState(currentUser?.currency || 'INR');
        const [soundEnabled, setSoundEnabled] = useState(true);

        // Active Viewport / Filtering
        const [selectedMonth, setSelectedMonth] = useState(8);
        const [selectedYear, setSelectedYear] = useState(2026);
        const [txFilterType, setTxFilterType] = useState('all');
        const [txFilterCat, setTxFilterCat] = useState('all');
        const [txSearch, setTxSearch] = useState('');

        // Camera / Canvas Transform
        const [camera, setCamera] = useState({ x: 0, y: 0, zoom: 1 });
        const [isDragging, setIsDragging] = useState(false);
        const [dragStart, setDragStart] = useState({ x: 0, y: 0 });
        const [activeZone, setActiveZone] = useState('core');

        // Modals
        const [modalTxOpen, setModalTxOpen] = useState(false);
        const [editingTx, setEditingTx] = useState(null);
        const [modalBudgetOpen, setModalBudgetOpen] = useState(false);
        const [modalCatOpen, setModalCatOpen] = useState(false);
        const [modalExportOpen, setModalExportOpen] = useState(false);
        const [toasts, setToasts] = useState([]);

        // Sync storage
        useEffect(() => setStored('users', users), [users]);
        useEffect(() => setStored('categories', categories), [categories]);
        useEffect(() => setStored('transactions', transactions), [transactions]);
        useEffect(() => setStored('budgets', budgets), [budgets]);
        useEffect(() => setStored('current_user', currentUser), [currentUser]);

        const addToast = (type, title, description) => {
          const id = `toast-${Date.now()}`;
          setToasts(prev => [...prev, { id, type, title, description }]);
          sound.play(type === 'error' ? 'delete' : 'success');
          setTimeout(() => {
            setToasts(prev => prev.filter(t => t.id !== id));
          }, 4000);
        };

        // Warp Camera Smoothly to Spatial Zone
        const warpToZone = useCallback((zoneId) => {
          const zone = SPATIAL_ZONES.find(z => z.id === zoneId);
          if (!zone) return;
          sound.play('warp');
          setActiveZone(zoneId);
          setCamera({
            x: -zone.x * zone.zoom + window.innerWidth / 2,
            y: -zone.y * zone.zoom + window.innerHeight / 2,
            zoom: zone.zoom,
          });
        }, []);

        // Initial warp to core on mount
        useEffect(() => {
          if (currentUser) warpToZone('core');
        }, [currentUser, warpToZone]);

        // Keyboard Shortcuts
        useEffect(() => {
          const handleKey = (e) => {
            if (['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) return;
            if (e.key === '1') warpToZone('core');
            if (e.key === '2') warpToZone('transactions');
            if (e.key === '3') warpToZone('budget');
            if (e.key === '4') warpToZone('observatory');
            if (e.key === '5') warpToZone('timetunnel');
            if (e.key === '6' && currentUser?.role === 'admin') warpToZone('admin');
            if (e.key === '0') warpToZone('core');
            if (e.key === 'n' || e.key === 'N') {
              setEditingTx(null);
              setModalTxOpen(true);
            }
            if (e.key === 'Escape') {
              setModalTxOpen(false);
              setModalBudgetOpen(false);
              setModalCatOpen(false);
              setModalExportOpen(false);
            }
          };
          window.addEventListener('keydown', handleKey);
          return () => window.removeEventListener('keydown', handleKey);
        }, [warpToZone, currentUser]);

        // Canvas Pan / Zoom Handlers
        const onMouseDown = (e) => {
          if (e.button !== 0 || e.target.closest('.interactive-card') || e.target.closest('.hud-element')) return;
          setIsDragging(true);
          setDragStart({ x: e.clientX - camera.x, y: e.clientY - camera.y });
        };

        const onMouseMove = (e) => {
          if (!isDragging) return;
          setCamera(prev => ({
            ...prev,
            x: e.clientX - dragStart.x,
            y: e.clientY - dragStart.y,
          }));
        };

        const onMouseUp = () => setIsDragging(false);

        const onWheel = (e) => {
          if (e.target.closest('.scrollable-content')) return;
          e.preventDefault();
          const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
          setCamera(prev => {
            const newZoom = Math.min(Math.max(prev.zoom * zoomFactor, 0.4), 1.8);
            const mouseX = e.clientX;
            const mouseY = e.clientY;
            const newX = mouseX - (mouseX - prev.x) * (newZoom / prev.zoom);
            const newY = mouseY - (mouseY - prev.y) * (newZoom / prev.zoom);
            return { x: newX, y: newY, zoom: newZoom };
          });
        };

        // Filtered Transactions for user & period
        const userTxs = useMemo(() => {
          if (!currentUser) return [];
          return transactions.filter(t => t.user_id === currentUser.id);
        }, [transactions, currentUser]);

        const currentMonthTxs = useMemo(() => {
          return userTxs.filter(t => {
            const d = new Date(t.date);
            return d.getMonth() + 1 === selectedMonth && d.getFullYear() === selectedYear;
          });
        }, [userTxs, selectedMonth, selectedYear]);

        const filteredTxs = useMemo(() => {
          let list = currentMonthTxs;
          if (txFilterType !== 'all') list = list.filter(t => t.type === txFilterType);
          if (txFilterCat !== 'all') list = list.filter(t => t.category_id === txFilterCat);
          if (txSearch.trim()) {
            const q = txSearch.toLowerCase();
            list = list.filter(t => t.description.toLowerCase().includes(q));
          }
          return list.sort((a, b) => new Date(b.date) - new Date(a.date));
        }, [currentMonthTxs, txFilterType, txFilterCat, txSearch]);

        // Financial Metrics Computation
        const monthlyIncome = useMemo(() => {
          return currentMonthTxs.filter(t => t.type === 'income').reduce((sum, t) => sum + t.amount, 0);
        }, [currentMonthTxs]);

        const monthlyExpense = useMemo(() => {
          return currentMonthTxs.filter(t => t.type === 'expense').reduce((sum, t) => sum + t.amount, 0);
        }, [currentMonthTxs]);

        const netSavings = monthlyIncome - monthlyExpense;
        const savingsRate = monthlyIncome > 0 ? ((monthlyIncome - monthlyExpense) / monthlyIncome) * 100 : 0;

        const currentBudget = useMemo(() => {
          return budgets.find(b => b.user_id === currentUser?.id && b.month === selectedMonth && b.year === selectedYear) || {
            overall_limit: 60000,
            category_limits: {}
          };
        }, [budgets, currentUser, selectedMonth, selectedYear]);

        const budgetUsagePct = currentBudget.overall_limit > 0 ? (monthlyExpense / currentBudget.overall_limit) * 100 : 0;
        const budgetRemaining = Math.max(0, currentBudget.overall_limit - monthlyExpense);
        const isBudgetExceeded = monthlyExpense > currentBudget.overall_limit;

        // Health Score (0 - 100)
        const healthScore = useMemo(() => {
          let score = 50;
          if (savingsRate >= 30) score += 25;
          else if (savingsRate >= 15) score += 15;
          else if (savingsRate > 0) score += 5;
          else score -= 20;

          if (!isBudgetExceeded && budgetUsagePct < 80) score += 20;
          else if (!isBudgetExceeded) score += 10;
          else score -= 25;

          if (currentMonthTxs.length > 4) score += 5;
          return Math.max(10, Math.min(100, score));
        }, [savingsRate, isBudgetExceeded, budgetUsagePct, currentMonthTxs]);

        // Category Breakdown
        const categoryBreakdown = useMemo(() => {
          const expenseCats = categories.filter(c => c.type === 'expense');
          return expenseCats.map(cat => {
            const spent = currentMonthTxs.filter(t => t.category_id === cat.id).reduce((sum, t) => sum + t.amount, 0);
            const percentage = monthlyExpense > 0 ? (spent / monthlyExpense) * 100 : 0;
            const limit = currentBudget.category_limits?.[cat.id] || 0;
            return {
              ...cat,
              spent,
              percentage: Number(percentage.toFixed(1)),
              limit,
              isExceeded: limit > 0 && spent > limit
            };
          }).filter(c => c.spent > 0).sort((a, b) => b.spent - a.spent);
        }, [categories, currentMonthTxs, monthlyExpense, currentBudget]);

        // Historical Timeline Data (Last 6 Months)
        const timelineData = useMemo(() => {
          const names = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
          const items = [];
          for (let i = 5; i >= 0; i--) {
            let m = 8 - i;
            let y = 2026;
            if (m <= 0) { m += 12; y -= 1; }
            const txs = userTxs.filter(t => {
              const d = new Date(t.date);
              return d.getMonth() + 1 === m && d.getFullYear() === y;
            });
            const inc = txs.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
            const exp = txs.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
            items.push({
              month: m,
              year: y,
              name: names[m - 1],
              income: inc,
              expense: exp,
              savings: inc - exp,
              isCurrent: m === selectedMonth && y === selectedYear
            });
          }
          return items;
        }, [userTxs, selectedMonth, selectedYear]);

        // --- Auth Handlers ---
        const handleLogin = (e) => {
          e?.preventDefault();
          const user = users.find(u => u.email.toLowerCase() === authEmail.trim().toLowerCase());
          if (!user) {
            addToast('error', 'Authentication Failed', 'Account not found. Use Demo Login or register.');
            return;
          }
          setCurrentUser(user);
          setCurrency(user.currency || 'INR');
          addToast('success', `Welcome back, ${user.name}!`, 'Spatial matrix initialized.');
        };

        const handleRegister = (e) => {
          e.preventDefault();
          if (!authName || !authEmail || !authPassword) {
            addToast('error', 'Missing Information', 'Please fill in all registration fields.');
            return;
          }
          const existing = users.find(u => u.email.toLowerCase() === authEmail.trim().toLowerCase());
          if (existing) {
            addToast('error', 'Account Exists', 'An account with this email is already registered.');
            return;
          }
          const newUser = {
            id: `usr-${Date.now()}`,
            name: authName.trim(),
            email: authEmail.trim().toLowerCase(),
            role: 'user',
            status: 'active',
            currency: 'INR',
            created_at: new Date().toISOString()
          };
          setUsers(prev => [...prev, newUser]);
          setCurrentUser(newUser);
          addToast('success', 'Profile Created!', `Welcome to Aetheria, ${newUser.name}.`);
        };

        const handleDemoLogin = (role) => {
          const target = users.find(u => u.role === role) || DEFAULT_USERS.find(u => u.role === role);
          setCurrentUser(target);
          setCurrency(target.currency || 'INR');
          addToast('success', `Logged in as ${target.name}`, `Role: ${role.toUpperCase()}`);
        };

        // --- Transaction Actions ---
        const handleSaveTx = (txData) => {
          if (editingTx) {
            setTransactions(prev => prev.map(t => t.id === editingTx.id ? { ...t, ...txData } : t));
            addToast('success', 'Transaction Synchronized', `${txData.description} updated.`);
          } else {
            const newTx = {
              id: `tx-${Date.now()}`,
              user_id: currentUser.id,
              ...txData,
              created_at: new Date().toISOString()
            };
            setTransactions(prev => [newTx, ...prev]);
            addToast('success', 'Transaction Recorded', `${txData.description} orbit saved.`);
          }
          setModalTxOpen(false);
          setEditingTx(null);
        };

        const handleDeleteTx = (id) => {
          setTransactions(prev => prev.filter(t => t.id !== id));
          sound.play('delete');
          addToast('info', 'Transaction Dissolved', 'Record removed from ledger.');
        };

        // --- Budget Action ---
        const handleSaveBudget = (overallLimit, catLimits) => {
          const existingIdx = budgets.findIndex(b => b.user_id === currentUser.id && b.month === selectedMonth && b.year === selectedYear);
          const newBudget = {
            id: existingIdx !== -1 ? budgets[existingIdx].id : `bdg-${currentUser.id}-${selectedMonth}-${selectedYear}`,
            user_id: currentUser.id,
            month: selectedMonth,
            year: selectedYear,
            overall_limit: overallLimit,
            category_limits: catLimits,
            updated_at: new Date().toISOString()
          };
          if (existingIdx !== -1) {
            setBudgets(prev => prev.map((b, i) => i === existingIdx ? newBudget : b));
          } else {
            setBudgets(prev => [...prev, newBudget]);
          }
          setModalBudgetOpen(false);
          addToast('success', 'Budget Thresholds Reconfigured', `Limit set to ${formatMoney(overallLimit, currency)}`);
        };

        // --- Category Action ---
        const handleSaveCategory = (catData) => {
          const newCat = {
            id: `cat-${Date.now()}`,
            ...catData,
            is_default: false,
            status: 'active',
            created_by: currentUser.id,
            created_at: new Date().toISOString()
          };
          setCategories(prev => [...prev, newCat]);
          setModalCatOpen(false);
          addToast('success', 'Category Created', `${catData.name} available in vectors.`);
        };

        // --- Export Action ---
        const handleExport = (format) => {
          const exportData = userTxs.map(t => {
            const c = categories.find(cat => cat.id === t.category_id);
            return {
              Date: t.date,
              Type: t.type.toUpperCase(),
              Category: c ? c.name : 'Unknown',
              Description: t.description,
              Amount: t.amount,
              Currency: currency
            };
          });

          if (format === 'json') {
            const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Aetheria_Ledger_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
          } else {
            const headers = ['Date', 'Type', 'Category', 'Description', 'Amount', 'Currency'];
            const rows = exportData.map(d => [d.Date, d.Type, `"${d.Category}"`, `"${d.Description}"`, d.Amount, d.Currency]);
            const csv = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Aetheria_Ledger_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
          }
          setModalExportOpen(false);
          addToast('success', 'Ledger Exported', `Downloaded as ${format.toUpperCase()}`);
        };

        // ==========================================
        // RENDER: LOGIN VIEW (if unauthenticated)
        // ==========================================
        if (!currentUser) {
          return (
            <div className="relative w-screen h-screen bg-[#07090e] flex items-center justify-center matrix-grid overflow-hidden">
              <div className="absolute inset-0 bg-radial from-transparent via-[#07090e]/80 to-[#07090e] pointer-events-none"></div>
              
              {/* Glowing Ambient Orbs */}
              <div className="absolute w-[500px] h-[500px] bg-cyber-cyan/10 rounded-full blur-[120px] -top-32 -left-32 animate-pulse-glow"></div>
              <div className="absolute w-[500px] h-[500px] bg-neon-purple/15 rounded-full blur-[120px] -bottom-32 -right-32 animate-pulse-glow"></div>

              <div className="relative z-10 w-full max-w-md p-8 glass-panel rounded-2xl glow-border shadow-2xl">
                {/* Brand Header */}
                <div className="text-center mb-6">
                  <div className="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-cyber-cyan/10 border border-cyber-cyan/30 text-cyber-cyan shadow-glow-cyan mb-3">
                    <Icons.Orbit />
                  </div>
                  <h1 className="text-2xl font-bold font-display tracking-wider text-slate-100 flex items-center justify-center gap-2">
                    AETHERIA <span className="text-xs px-2 py-0.5 rounded bg-cyber-cyan/20 text-cyber-cyan border border-cyber-cyan/40">2026</span>
                  </h1>
                  <p className="text-xs text-slate-400 font-mono mt-1">SPATIAL FINANCIAL COMMAND MATRIX</p>
                </div>

                {/* Tabs */}
                <div className="flex bg-slate-900/60 p-1 rounded-xl mb-6 border border-slate-800">
                  <button
                    onClick={() => { setAuthMode('login'); sound.play('click'); }}
                    className={`flex-1 py-2 text-xs font-semibold rounded-lg transition-all ${authMode === 'login' ? 'bg-cyber-cyan/20 text-cyber-cyan shadow-sm border border-cyber-cyan/30' : 'text-slate-400 hover:text-slate-200'}`}
                  >
                    ACCESS MATRIX
                  </button>
                  <button
                    onClick={() => { setAuthMode('register'); sound.play('click'); }}
                    className={`flex-1 py-2 text-xs font-semibold rounded-lg transition-all ${authMode === 'register' ? 'bg-cyber-cyan/20 text-cyber-cyan shadow-sm border border-cyber-cyan/30' : 'text-slate-400 hover:text-slate-200'}`}
                  >
                    REGISTER AGENT
                  </button>
                </div>

                {/* Form */}
                <form onSubmit={authMode === 'login' ? handleLogin : handleRegister} className="space-y-4">
                  {authMode === 'register' && (
                    <div>
                      <label className="block text-xs font-mono text-slate-400 mb-1">COMMANDER NAME</label>
                      <input
                        type="text"
                        value={authName}
                        onChange={e => setAuthName(e.target.value)}
                        placeholder="e.g. Alex Vance"
                        className="w-full bg-slate-950/80 border border-slate-700/80 rounded-xl px-4 py-2.5 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-cyber-cyan transition-all"
                        required
                      />
                    </div>
                  )}

                  <div>
                    <label className="block text-xs font-mono text-slate-400 mb-1">QUANTUM ID (EMAIL)</label>
                    <input
                      type="email"
                      value={authEmail}
                      onChange={e => setAuthEmail(e.target.value)}
                      placeholder="user@spatialexpense.com"
                      className="w-full bg-slate-950/80 border border-slate-700/80 rounded-xl px-4 py-2.5 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-cyber-cyan transition-all"
                      required
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-mono text-slate-400 mb-1">CIPHER KEY (PASSWORD)</label>
                    <input
                      type="password"
                      value={authPassword}
                      onChange={e => setAuthPassword(e.target.value)}
                      placeholder="••••••••"
                      className="w-full bg-slate-950/80 border border-slate-700/80 rounded-xl px-4 py-2.5 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-cyber-cyan transition-all"
                      required
                    />
                  </div>

                  <button
                    type="submit"
                    className="w-full mt-2 py-3 bg-gradient-to-r from-cyber-cyan to-laser-blue text-slate-950 font-bold text-sm rounded-xl shadow-glow-cyan hover:opacity-95 active:scale-[0.99] transition-all flex items-center justify-center gap-2"
                  >
                    <Icons.Sparkles />
                    {authMode === 'login' ? 'INITIALIZE CONNECTION' : 'CREATE PROTOCOL'}
                  </button>
                </form>

                {/* Instant 1-Click Demo Login Buttons */}
                <div className="mt-6 pt-5 border-t border-slate-800/80">
                  <p className="text-center text-[11px] font-mono text-slate-500 mb-3">INSTANT TELEMETRY ACCESS</p>
                  <div className="grid grid-cols-2 gap-3">
                    <button
                      onClick={() => handleDemoLogin('user')}
                      className="py-2.5 px-3 bg-slate-900/80 hover:bg-cyber-cyan/15 border border-slate-700 hover:border-cyber-cyan/50 text-slate-300 hover:text-cyber-cyan rounded-xl text-xs font-mono flex items-center justify-center gap-1.5 transition-all"
                    >
                      <Icons.Wallet /> DEMO USER
                    </button>
                    <button
                      onClick={() => handleDemoLogin('admin')}
                      className="py-2.5 px-3 bg-slate-900/80 hover:bg-neon-purple/20 border border-slate-700 hover:border-neon-purple/50 text-slate-300 hover:text-purple-300 rounded-xl text-xs font-mono flex items-center justify-center gap-1.5 transition-all"
                    >
                      <Icons.Shield /> DEMO ADMIN
                    </button>
                  </div>
                </div>
              </div>
            </div>
          );
        }

        // ==========================================
        // RENDER: MAIN SPATIAL CANVAS INTERFACE
        // ==========================================
        return (
          <div 
            className="relative w-screen h-screen overflow-hidden bg-[#07090e] select-none matrix-grid cursor-grab active:cursor-grabbing"
            onMouseDown={onMouseDown}
            onMouseMove={onMouseMove}
            onMouseUp={onMouseUp}
            onWheel={onWheel}
          >
            {/* Top Center Floating Navigation Dock */}
            <div className="hud-element fixed top-4 left-1/2 -translate-x-1/2 z-50 flex items-center gap-2 p-1.5 glass-panel rounded-2xl glow-border shadow-2xl">
              {SPATIAL_ZONES.map(z => {
                if (z.adminOnly && currentUser.role !== 'admin') return null;
                const isActive = activeZone === z.id;
                const IconComponent = Icons[z.icon] || Icons.Compass;
                return (
                  <button
                    key={z.id}
                    onClick={() => warpToZone(z.id)}
                    title={`${z.name} (${z.desc})`}
                    className={`flex items-center gap-2 px-3 py-2 rounded-xl text-xs font-mono font-medium transition-all ${
                      isActive 
                        ? 'bg-cyber-cyan/20 text-cyber-cyan border border-cyber-cyan/40 shadow-glow-cyan' 
                        : 'text-slate-400 hover:text-slate-200 hover:bg-white/5'
                    }`}
                  >
                    <IconComponent />
                    <span className="hidden md:inline">{z.name}</span>
                  </button>
                );
              })}

              <div className="h-5 w-[1px] bg-slate-700/60 mx-1"></div>

              {/* Currency Selector */}
              <select
                value={currency}
                onChange={e => setCurrency(e.target.value)}
                className="bg-slate-900 border border-slate-700 text-cyber-cyan rounded-lg px-2 py-1 text-xs font-mono focus:outline-none"
              >
                <option value="INR">₹ INR</option>
                <option value="USD">$ USD</option>
                <option value="EUR">€ EUR</option>
                <option value="GBP">£ GBP</option>
                <option value="JPY">¥ JPY</option>
              </select>

              {/* Export Button */}
              <button
                onClick={() => setModalExportOpen(true)}
                title="Export Data (CSV/JSON)"
                className="p-2 text-slate-400 hover:text-cyber-cyan hover:bg-white/5 rounded-lg transition-all"
              >
                <Icons.Download />
              </button>

              {/* Logout Button */}
              <button
                onClick={() => { setCurrentUser(null); sound.play('delete'); }}
                title="Logout"
                className="p-2 text-slate-400 hover:text-rose-400 hover:bg-rose-500/10 rounded-lg transition-all"
              >
                <Icons.LogOut />
              </button>
            </div>

            {modalTxOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
                <div className="w-full max-w-md p-6 glass-panel rounded-3xl glow-border shadow-2xl">
                  <div className="flex justify-between items-center mb-4">
                    <h3 className="text-lg font-bold font-display text-slate-100 flex items-center gap-2">
                      <Icons.Orbit /> {editingTx ? 'UPDATE TRANSACTION' : 'RECORD TRANSACTION'}
                    </h3>
                    <button onClick={() => setModalTxOpen(false)} className="text-slate-400 hover:text-slate-100">✕</button>
                  </div>

                  <form onSubmit={(e) => {
                    e.preventDefault();
                    const form = e.target;
                    handleSaveTx({
                      type: form.type.value,
                      amount: parseFloat(form.amount.value),
                      category_id: form.category_id.value,
                      description: form.description.value.trim(),
                      date: form.date.value,
                    });
                  }} className="space-y-4">
                    <div className="grid grid-cols-2 gap-2">
                      <label className="flex items-center gap-2 p-3 bg-slate-900/80 rounded-xl border border-slate-700 cursor-pointer">
                        <input type="radio" name="type" value="expense" defaultChecked={editingTx?.type !== 'income'} />
                        <span className="text-xs font-mono text-rose-400 font-bold">OUTFLOW (EXPENSE)</span>
                      </label>
                      <label className="flex items-center gap-2 p-3 bg-slate-900/80 rounded-xl border border-slate-700 cursor-pointer">
                        <input type="radio" name="type" value="income" defaultChecked={editingTx?.type === 'income'} />
                        <span className="text-xs font-mono text-emerald-400 font-bold">INFLOW (INCOME)</span>
                      </label>
                    </div>

                    <div>
                      <label className="block text-xs font-mono text-slate-400 mb-1">AMOUNT ({currency})</label>
                      <input
                        type="number"
                        name="amount"
                        step="0.01"
                        defaultValue={editingTx?.amount || ''}
                        placeholder="0.00"
                        className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 font-display font-bold text-lg focus:outline-none focus:border-cyber-cyan"
                        required
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-mono text-slate-400 mb-1">CATEGORY VECTOR</label>
                      <select
                        name="category_id"
                        defaultValue={editingTx?.category_id || categories[0]?.id}
                        className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-xs text-slate-200 focus:outline-none focus:border-cyber-cyan"
                      >
                        {categories.map(c => (
                          <option key={c.id} value={c.id}>{c.name} ({c.type.toUpperCase()})</option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-mono text-slate-400 mb-1">DESCRIPTION</label>
                      <input
                        type="text"
                        name="description"
                        defaultValue={editingTx?.description || ''}
                        placeholder="e.g. Sub-Orbital Transit Ticket"
                        className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-xs text-slate-100 focus:outline-none focus:border-cyber-cyan"
                        required
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-mono text-slate-400 mb-1">DATE</label>
                      <input
                        type="date"
                        name="date"
                        defaultValue={editingTx?.date || new Date().toISOString().split('T')[0]}
                        className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-xs text-slate-100 focus:outline-none focus:border-cyber-cyan"
                        required
                      />
                    </div>

                    <button
                      type="submit"
                      className="w-full py-3 bg-gradient-to-r from-cyber-cyan to-laser-blue text-slate-950 font-bold text-xs font-mono rounded-xl shadow-glow-cyan hover:opacity-95 transition-all"
                    >
                      {editingTx ? 'SYNCHRONIZE CHANGES' : 'RECORD TRANSACTION'}
                    </button>
                  </form>
                </div>
              </div>
            )}

            {/* Budget Configuration Modal */}
            {modalBudgetOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
                <div className="w-full max-w-md p-6 glass-panel rounded-3xl glow-border shadow-2xl">
                  <div className="flex justify-between items-center mb-4">
                    <h3 className="text-lg font-bold font-display text-slate-100 flex items-center gap-2">
                      <Icons.Sliders /> BUDGET CAP PARAMETERS
                    </h3>
                    <button onClick={() => setModalBudgetOpen(false)} className="text-slate-400 hover:text-slate-100">✕</button>
                  </div>

                  <form onSubmit={(e) => {
                    e.preventDefault();
                    const form = e.target;
                    const overall = parseFloat(form.overall.value);
                    const catLimits = {};
                    categories.filter(c => c.type === 'expense').forEach(c => {
                      const val = parseFloat(form[`cat_${c.id}`]?.value || 0);
                      if (val > 0) catLimits[c.id] = val;
                    });
                    handleSaveBudget(overall, catLimits);
                  }} className="space-y-4">
                    <div>
                      <label className="block text-xs font-mono text-slate-400 mb-1">MONTHLY TOTAL CAP ({currency})</label>
                      <input
                        type="number"
                        name="overall"
                        defaultValue={currentBudget.overall_limit}
                        className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 font-display font-bold text-lg focus:outline-none focus:border-cyber-cyan"
                        required
                      />
                    </div>

                    <div className="text-xs font-mono text-slate-400 mb-1">CATEGORY SPECIFIC CEILINGS</div>
                    <div className="space-y-2 max-h-[220px] overflow-y-auto pr-1">
                      {categories.filter(c => c.type === 'expense').map(c => (
                        <div key={c.id} className="flex items-center justify-between gap-3 p-2 bg-slate-950/60 rounded-xl">
                          <span className="text-xs text-slate-300">{c.name}</span>
                          <input
                            type="number"
                            name={`cat_${c.id}`}
                            defaultValue={currentBudget.category_limits?.[c.id] || ''}
                            placeholder="0"
                            className="w-24 bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 text-xs text-right text-slate-100 font-mono"
                          />
                        </div>
                      ))}
                    </div>

                    <button
                      type="submit"
                      className="w-full py-3 bg-gradient-to-r from-cyber-cyan to-laser-blue text-slate-950 font-bold text-xs font-mono rounded-xl shadow-glow-cyan hover:opacity-95 transition-all"
                    >
                      APPLY BUDGET LIMITS
                    </button>
                  </form>
                </div>
              </div>
            )}

            {/* Category Modal */}
            {modalCatOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
                <div className="w-full max-w-md p-6 glass-panel rounded-3xl glow-border shadow-2xl">
                  <div className="flex justify-between items-center mb-4">
                    <h3 className="text-lg font-bold font-display text-slate-100 flex items-center gap-2">
                      <Icons.Tag /> CREATE VECTOR CATEGORY
                    </h3>
                    <button onClick={() => setModalCatOpen(false)} className="text-slate-400 hover:text-slate-100">✕</button>
                  </div>

                  <form onSubmit={(e) => {
                    e.preventDefault();
                    const form = e.target;
                    handleSaveCategory({
                      name: form.name.value.trim(),
                      type: form.type.value,
                      color: form.color.value,
                      icon: 'Tag',
                    });
                  }} className="space-y-4">
                    <div>
                      <label className="block text-xs font-mono text-slate-400 mb-1">CATEGORY NAME</label>
                      <input
                        type="text"
                        name="name"
                        placeholder="e.g. Subscriptions & Cloud"
                        className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-xs text-slate-100 focus:outline-none focus:border-cyber-cyan"
                        required
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-mono text-slate-400 mb-1">TYPE</label>
                      <select name="type" className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-xs text-slate-200">
                        <option value="expense">Expense (Outflow)</option>
                        <option value="income">Income (Inflow)</option>
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-mono text-slate-400 mb-1">ACCENT COLOR</label>
                      <input
                        type="color"
                        name="color"
                        defaultValue="#00f5d4"
                        className="w-full h-10 bg-slate-950 border border-slate-700 rounded-xl cursor-pointer"
                      />
                    </div>

                    <button
                      type="submit"
                      className="w-full py-3 bg-gradient-to-r from-cyber-cyan to-laser-blue text-slate-950 font-bold text-xs font-mono rounded-xl shadow-glow-cyan hover:opacity-95 transition-all"
                    >
                      ADD CATEGORY
                    </button>
                  </form>
                </div>
              </div>
            )}

            {/* Export Modal */}
            {modalExportOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
                <div className="w-full max-w-sm p-6 glass-panel rounded-3xl glow-border shadow-2xl text-center">
                  <div className="w-12 h-12 rounded-2xl bg-cyber-cyan/10 border border-cyber-cyan/30 text-cyber-cyan flex items-center justify-center mx-auto mb-3">
                    <Icons.Download />
                  </div>
                  <h3 className="text-lg font-bold font-display text-slate-100 mb-1">EXPORT LEDGER</h3>
                  <p className="text-xs text-slate-400 font-mono mb-6">Choose your preferred export serialization format</p>
                  
                  <div className="grid grid-cols-2 gap-3 mb-4">
                    <button
                      onClick={() => handleExport('csv')}
                      className="py-3 px-4 bg-slate-900 hover:bg-cyber-cyan/20 border border-slate-700 hover:border-cyber-cyan text-slate-200 hover:text-cyber-cyan rounded-xl text-xs font-mono font-bold transition-all"
                    >
                      CSV FORMAT (.csv)
                    </button>
                    <button
                      onClick={() => handleExport('json')}
                      className="py-3 px-4 bg-slate-900 hover:bg-neon-purple/20 border border-slate-700 hover:border-neon-purple text-slate-200 hover:text-purple-300 rounded-xl text-xs font-mono font-bold transition-all"
                    >
                      JSON FORMAT (.json)
                    </button>
                  </div>

                  <button
                    onClick={() => setModalExportOpen(false)}
                    className="text-xs text-slate-500 hover:text-slate-300 font-mono"
                  >
                    Cancel
                  </button>
                </div>
              </div>
            )}

            {/* Toast Notifications */}
            <div className="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none mb-16">
              {toasts.map(t => (
                <div
                  key={t.id}
                  className="p-3 px-4 glass-panel rounded-xl glow-border border-cyber-cyan/40 shadow-2xl flex items-center gap-3 animate-float"
                >
                  <Icons.Sparkles />
                  <div>
                    <div className="text-xs font-bold text-slate-100">{t.title}</div>
                    {t.description && <div className="text-[10px] text-slate-400 font-mono">{t.description}</div>}
                  </div>
                </div>
              ))}
            </div>
          </div>
        );
      }

      // Mount Standalone React Root
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
